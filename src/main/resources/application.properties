#spring.config.import=optional:configserver:
spring.cloud.config.enabled=false
spring.jackson.time-zone=America/Mexico_City

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestopagos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:admin}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.jakarta.persistence.query.timeout=600000

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=18800
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1


spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD:12345678}
gestopago.auth.refresh-rate-ms=3600000

# Timeouts de conexion/lectura para los clientes Feign contra GestoPago
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=30000

# Cron diario a las 06:00 hrs para cargar el catalogo de productos GestoPago
gestopago.catalogo.cron=0 0 6 * * *
# Carga inicial del catalogo al arrancar (ms de espera para que el token se renueve primero)
gestopago.catalogo.startup-delay-ms=3000

# Cifrado AES PuntoRed / GestoPago
gestopago.crypto.secret-key=${GESTOPAGO_SECRET_KEY:HPo7OLqB4Fkk4E2yGOtwqw8H5fHR9kNx67OR4g4UdlA=}
gestopago.crypto.iv=${GESTOPAGO_IV:p5ldmBPdd/9pjC0bDC/nSg==}

# Transacciones (sendTx.do)
gestopago.tx.unidad=${GESTOPAGO_UNIDAD:083}
gestopago.tx.api-key=${GESTOPAGO_API_KEY:dev-api-key}
gestopago.tx.monto-minimo=1.00
gestopago.tx.monto-maximo=10000.00
# Ventana (s) en la que una solicitud identica a otra reciente se rechaza como duplicada. 0 = desactivado
gestopago.tx.ventana-duplicado-segundos=60
# Codigos del proveedor que significan "en proceso" (no concluyentes), separados por coma
gestopago.tx.codigos-pendientes=
# Conciliacion de operaciones con resultado incierto
gestopago.tx.conciliacion.habilitada=true
gestopago.tx.conciliacion.espera-minutos=5
gestopago.tx.conciliacion.max-intentos=5
gestopago.tx.conciliacion.intervalo-ms=300000
# SOLO activar si GestoPago confirma por escrito que reenviar el mismo UPC es idempotente
gestopago.tx.conciliacion.reenvio-mismo-upc=false

# Timeout propio para sendTx (la lectura es el punto ambiguo: ver ConciliacionService)
spring.cloud.openfeign.client.config.gestoPagoTx.connect-timeout=3000
spring.cloud.openfeign.client.config.gestoPagoTx.read-timeout=20000
spring.cloud.openfeign.client.config.gestoPagoTx.logger-level=none

# JWT propio de la API
app.jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWp3dC1kZXZlbG9wbWVudA==}


spring.data.mongodb.uri=${MONGO_URI:mongodb://admin:admin@localhost:27017/gestopago?authSource=admin}

server.forward-headers-strategy=framework

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


logging.level.com.proyecto.servicios=INFO
